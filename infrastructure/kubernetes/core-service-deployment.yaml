apiVersion: apps/v1
kind: Deployment
metadata:
  name: core-service
  labels:
    app: core-service
spec:
  replicas: 3
  selector:
    matchLabels:
      app: core-service
  template:
    metadata:
      labels:
        app: core-service
    spec:
      containers:
        - name: core-service
          image: your-core-service-image:latest
          ports:
            - containerPort: 8080
          env:
            - name: ENV_VAR_NAME
              value: some-value
