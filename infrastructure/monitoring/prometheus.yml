global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'it-ops-hub'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'core-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['core-service:8080']

  - job_name: 'events-alarms-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['events-alarms-service:8081']

  - job_name: 'metrics-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['metrics-service:8082']

alerting:
  alertmanagers:
    - static_configs:
        - targets: []
