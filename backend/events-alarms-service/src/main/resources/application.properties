# Quarkus Events & Alarms Service Configuration
quarkus.application.name=events-alarms-service
quarkus.application.version=1.0.0

# Server Configuration
quarkus.http.port=8081
quarkus.http.host=0.0.0.0

# Logging Configuration
quarkus.log.level=INFO
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n
quarkus.log.console.enable=true

# Prometheus Metrics
quarkus.micrometer.export.prometheus.enabled=true
quarkus.micrometer.enabled=true

# Health Checks
quarkus.smallrye-health.path=/health

# OpenAPI/Swagger
quarkus.smallrye-openapi.path=/swagger-ui
quarkus.swagger-ui.always-include=true

# Datasource
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/appdb
quarkus.datasource.username=app
quarkus.datasource.password=app

# Hibernate Configuration
quarkus.hibernate-orm.database.generation=create-drop
quarkus.hibernate-orm.log.sql=false