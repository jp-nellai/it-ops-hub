services:
  # PostgreSQL Database
  postgres:
    image: postgres:18-alpine
    container_name: it-ops-postgres
    environment:
      POSTGRES_USER: itops
      POSTGRES_PASSWORD: itops123
      POSTGRES_DB: itops_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/18/docker
    networks:
      - it-ops-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U itops -d itops_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Core Service
  core-service:
    build:
      context: ./backend/core-service
      dockerfile: Dockerfile
    container_name: core-service
    ports:
      - "8080:8080"
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/itops_db
      QUARKUS_DATASOURCE_USERNAME: itops
      QUARKUS_DATASOURCE_PASSWORD: itops123
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - it-ops-network

  # Events & Alarms Service
  events-alarms-service:
    build:
      context: ./backend/events-alarms-service
      dockerfile: Dockerfile
    container_name: events-alarms-service
    ports:
      - "8081:8081"
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/itops_db
      QUARKUS_DATASOURCE_USERNAME: itops
      QUARKUS_DATASOURCE_PASSWORD: itops123
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - it-ops-network

  # Metrics Service
  metrics-service:
    build:
      context: ./backend/metrics-service
      dockerfile: Dockerfile
    container_name: metrics-service
    ports:
      - "8082:8082"
    networks:
      - it-ops-network

  # Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - it-ops-network

  # Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/monitoring/grafana/provisioning:/etc/grafana/provisioning
    networks:
      - it-ops-network
    depends_on:
      - prometheus

  # Elasticsearch
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.3.2
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - it-ops-network

  # Kibana
  kibana:
    image: docker.elastic.co/kibana/kibana:9.3.2
    container_name: kibana
    ports:
      - "5601:5601"
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    depends_on:
      - elasticsearch
    networks:
      - it-ops-network

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: it-ops-frontend
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:8080
    depends_on:
      - metrics-service
      - core-service
      - events-alarms-service
    networks:
      - it-ops-network

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
  elasticsearch_data:

networks:
  it-ops-network:
    driver: bridge